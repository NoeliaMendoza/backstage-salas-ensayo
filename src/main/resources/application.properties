spring.application.name=Backstage
backstage.pase=${BACKSTAGE_PASS:ROCK-LOCAL-2027}
backstage.zona=America/Guayaquil
backstage.max-horas-diarias=6
spring.mail.host=localhost
spring.mail.port=1025
# La base de datos se configura explícitamente solo en el perfil h2.
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=false
